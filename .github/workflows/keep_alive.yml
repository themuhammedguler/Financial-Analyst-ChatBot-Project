name: Streamlit 24/7 Keep-Alive Heartbeat

on:
  schedule:
    # Her 6 saatte bir otomatik çalışır (Streamlit uyku modunu engeller)
    - cron: '0 */6 * * *'
  workflow_dispatch: # GitHub arayüzünden elle tetiklenebilir

jobs:
  ping:
    name: Ping Streamlit Apps
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Financial Analyst App
        run: |
          echo "Pinging Financial Analyst Chatbot App..."
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -o /dev/null -w "Health Status: %{http_code}\n" "https://financial-analyst-chatbot-project.streamlit.app/_stcore/health" || true
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -o /dev/null -w "Root Status: %{http_code}\n" "https://financial-analyst-chatbot-project.streamlit.app/" || true

      - name: Send Keep-Alive Ping to Trend Forecaster App
        run: |
          echo "Pinging Trend Forecaster App..."
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -o /dev/null -w "Health Status: %{http_code}\n" "https://bist-trend-forecaster.streamlit.app/_stcore/health" || true
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -o /dev/null -w "Root Status: %{http_code}\n" "https://bist-trend-forecaster.streamlit.app/" || true
