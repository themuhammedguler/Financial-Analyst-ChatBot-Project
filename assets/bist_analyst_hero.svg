    <text x="0" y="68" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">BIST Finansal Analist Asistanı</text>
    <text x="0" y="94" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Kurumsal BIST RAG Terminali • Hibrit Vektör Arama • DuPont &amp; Altman Risk Motoru • Portföy Simülatörü</text>
