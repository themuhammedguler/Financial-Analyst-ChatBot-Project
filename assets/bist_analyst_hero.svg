    <path d="M100,0 V480 M200,0 V480 M300,0 V480 M400,0 V480 M500,0 V480 M600,0 V480 M700,0 V480 M800,0 V480 M900,0 V480 M1000,0 V480 M1100,0 V480" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Top Ambient Glow -->
